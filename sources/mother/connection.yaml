# Fuente principal de Evidence. Usa el conector DuckDB, que sirve tanto para
# MotherDuck ("md:...") como para un fichero local, así las consultas
# (mother.<tabla>) son las mismas en los dos modos.
#
#   MotherDuck (por defecto, CI y producción): filename md:SpainFacts; DuckDB
#     toma el token de la variable de entorno motherduck_token.
#   Local: EVIDENCE_SOURCE__mother__filename=../../data/spainfacts.duckdb
#     (RELATIVA a esta carpeta: el conector siempre le antepone sources/mother)
#     (ver docs/desarrollo-local.md)
type: duckdb
name: mother
options:
  filename: md:SpainFacts
buildOptions:
  batchSize: 1000000
