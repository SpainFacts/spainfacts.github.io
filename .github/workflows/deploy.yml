name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # or whichever branch you want to deploy from
  repository_dispatch:
    types: [data-updated] # lo dispara Dagster tras refrescar los datos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: build
        env:
          BASE_PATH: '/'
          # 5 idiomas: el empaquetado necesita más memoria que el límite por defecto de Node
          NODE_OPTIONS: '--max-old-space-size=12288'
          # sources/mother usa el conector DuckDB con md:SpainFacts: DuckDB lee el token de aquí
          motherduck_token: ${{ secrets.EVIDENCE_SOURCE__MOTHER__TOKEN }}
          ## Add and uncomment any environment variables here
          ## EVIDENCE_SOURCE__my_source__username: ${{ secrets.EVIDENCE_SOURCE__MY_SOURCE__USERNAME }}
          ## EVIDENCE_SOURCE__my_source__private_key: ${{ secrets.EVIDENCE_SOURCE__MY_SOURCE__PRIVATE_KEY }}
        run: |
          npm run sources:strict
          npm run build:strict
          node tools/sitemap.mjs
          node tools/html-lang-es.mjs

      # Pruebas: si algo falla, no se despliega (la web publicada sigue como estaba)
      - name: Comprobar traducciones
        run: |
          node tools/i18n/comprobar.mjs
          node tools/i18n/estado.mjs

      - name: Prueba estática (lang, títulos, enlaces internos, undefined/NaN)
        run: node tools/pruebas/estatico.mjs

      - name: Prueba de humo con navegador
        run: |
          npx playwright install --with-deps chromium
          node tools/pruebas/humo.mjs --concurrencia 4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment

        uses: actions/deploy-pages@v4
