name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # or whichever branch you want to deploy from
  repository_dispatch:
    types: [data-updated] # lo dispara Dagster tras refrescar los datos
  # Lanzamiento a mano desde la pestaña Actions: siempre extracción completa
  workflow_dispatch:
  # Red de seguridad semanal (lunes 05:00 UTC) por si se cargan datos sin pasar por Dagster
  schedule:
    - cron: '0 5 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    # Un push nuevo cancela el build que aún está en marcha: solo se publica el último.
    # Si el cancelado traía [datos], el siguiente lo detecta (ver «Decidir tipo de extracción»)
    concurrency:
      group: build-pages
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Hasta 3 intentos: un fallo de red en npm tiraba el deploy entero
      - name: Install dependencies
        run: |
          for intento in 1 2 3; do
            npm install && exit 0
            echo "npm install falló (intento $intento), reintentando en 20 s"
            sleep 20
          done
          exit 1

      # Cada consulta a MotherDuck gasta cupo del plan gratuito. En un push de código
      # los datos no han cambiado: se reutilizan los parquets del despliegue anterior y
      # solo se lanzan las consultas de sources/ cuyo SQL ha cambiado (evidence sources
      # --changed compara un hash del SQL guardado en .evidence/meta/query-cache).
      # Extracción completa: Dagster (data-updated), lanzamiento a mano, la semanal o
      # un push con [datos] en el mensaje del commit.
      # [datos] se busca en todos los commits desde el último deploy correcto, no solo en el
      # último: un push con varios commits o un build cancelado por otro push no lo pierden
      - name: Decidir tipo de extracción
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          MENSAJE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MENSAJES="$MENSAJE"
          if [ "$EVENTO" = "push" ]; then
            ULTIMO=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --status success -L 1 --json headSha --jq '.[0].headSha' || true)
            if [ -n "$ULTIMO" ]; then
              MENSAJES=$(gh api "repos/$GITHUB_REPOSITORY/compare/$ULTIMO...$GITHUB_SHA" --jq '.commits[].commit.message' || echo '[datos]')
            fi
          fi
          if [ "$EVENTO" = "push" ] && ! printf '%s' "$MENSAJES" | grep -qiF '[datos]'; then
            echo "completa=false" >> "$GITHUB_OUTPUT"
            echo "Extracción incremental: solo las consultas cambiadas"
          else
            echo "completa=true" >> "$GITHUB_OUTPUT"
            echo "Extracción completa desde MotherDuck"
          fi

      # Sin caché (primera vez o caducada) --changed lo extrae todo, así que se recupera solo
      - name: Recuperar datos del despliegue anterior
        if: steps.modo.outputs.completa == 'false'
        uses: actions/cache/restore@v4
        with:
          path: |
            .evidence/template/static/data
            .evidence/meta/query-cache
          key: fuentes-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuentes-

      - name: Extraer fuentes
        env:
          # sources/mother usa el conector DuckDB con md:SpainFacts: DuckDB lee el token de aquí
          motherduck_token: ${{ secrets.EVIDENCE_SOURCE__MOTHER__TOKEN }}
        run: |
          if [ "${{ steps.modo.outputs.completa }}" = "true" ]; then
            npm run sources:strict
          else
            npm run sources:strict -- --changed
          fi

      - name: Guardar datos para el próximo despliegue
        uses: actions/cache/save@v4
        with:
          path: |
            .evidence/template/static/data
            .evidence/meta/query-cache
          key: fuentes-${{ github.run_id }}-${{ github.run_attempt }}

      # Modelo de embeddings con el que tools/chat/catalogo.mjs calcula los vectores de las tablas
      - name: Caché del modelo de embeddings del chat
        uses: actions/cache@v4
        with:
          path: ~/.cache/tjs
          key: modelos-chat-embeddinggemma-300m-no-gather-q4

      # Vectores del catálogo por texto: solo se recalculan los de las tablas que cambian
      - name: Caché de vectores del catálogo
        uses: actions/cache@v4
        with:
          path: ~/.cache/catalogo-vectores.json
          key: vectores-catalogo-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vectores-catalogo-

      # Resultados de las consultas del prerender del deploy anterior (patches/@evidence-dev+universal-sql):
      # la clave lleva el md5 de los parquets que usa cada consulta, así que solo se reutilizan
      # los de tablas que no han cambiado
      - name: Caché de consultas del prerender
        uses: actions/cache@v4
        with:
          path: ~/.cache/consultas-prerender
          key: consultas-prerender-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: consultas-prerender-

      # Teselas vectoriales del explorador de mapas (municipios y secciones censales): no van en git;
      # se rehacen con tippecanoe solo cuando cambian las geometrías o el script
      - name: Caché de las teselas del explorador de mapas
        id: teselas
        uses: actions/cache@v4
        with:
          path: static-extra/geo/espana.pmtiles
          key: teselas-${{ hashFiles('static/geo/municipios.geojson', 'static-extra/geo/secciones/**', 'tools/geo/teselas_mapas.py', 'tools/geo/teselas_mapas.sh') }}

      - name: Teselas del explorador de mapas
        if: steps.teselas.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tippecanoe
          bash tools/geo/teselas_mapas.sh

      - name: build
        env:
          BASE_PATH: '/'
          # 5 idiomas: el empaquetado necesita más memoria que el límite por defecto de Node
          NODE_OPTIONS: '--max-old-space-size=12288'
        run: |
          export SPAINFACTS_CACHE_VECTORES="$HOME/.cache/catalogo-vectores.json"
          export SPAINFACTS_CACHE_CONSULTAS="$HOME/.cache/consultas-prerender"
          mkdir -p "$SPAINFACTS_CACHE_CONSULTAS"
          echo "Consultas en caché: $(find "$SPAINFACTS_CACHE_CONSULTAS" -name '*.arrow' | wc -l)"
          touch "$RUNNER_TEMP/inicio-build"
          # Catálogo de tablas para el chat (/chat) y el servidor MCP (tools/mcp): no necesita
          # el sitio construido, así que se calcula a la vez que el build y se copia al final
          NODE_OPTIONS= node tools/chat/catalogo.mjs --salida "$RUNNER_TEMP/catalogo.json" > "$RUNNER_TEMP/catalogo.log" 2>&1 &
          CATALOGO=$!
          npm run build:strict
          # Fuera los resultados que este build no ha usado (cada acierto renueva la fecha del fichero)
          find "$SPAINFACTS_CACHE_CONSULTAS" -name '*.arrow' ! -newer "$RUNNER_TEMP/inicio-build" -delete
          echo "Consultas guardadas para el próximo deploy: $(find "$SPAINFACTS_CACHE_CONSULTAS" -name '*.arrow' | wc -l)"
          if ! wait $CATALOGO; then cat "$RUNNER_TEMP/catalogo.log"; exit 1; fi
          cat "$RUNNER_TEMP/catalogo.log"
          mkdir -p build/chat && cp "$RUNNER_TEMP/catalogo.json" build/chat/catalogo.json
          node tools/sitemap.mjs
          node tools/html-lang-es.mjs

      # Pruebas: si algo falla, no se despliega (la web publicada sigue como estaba)
      - name: Comprobar traducciones
        run: |
          node tools/i18n/comprobar.mjs
          node tools/i18n/estado.mjs

      - name: Prueba estática (lang, títulos, enlaces internos, undefined/NaN)
        run: node tools/pruebas/estatico.mjs

      - name: Prueba de humo con navegador
        run: |
          npx playwright install --with-deps chromium
          node tools/pruebas/humo.mjs --concurrencia 4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # La publicación en sí no se corta a medias: espera a la anterior
    concurrency:
      group: deploy-pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment

        uses: actions/deploy-pages@v4
