version: 2

sources:
  - name: raw_sermas
    description: "Servicio Madrileño de Salud (Consejería de Sanidad de la Comunidad de Madrid): listas de espera de la memoria anual y de los informes mensuales, y libre elección de hospital (ingestion/sermas.py)"
    schema: raw
    tables:
      - name: sermas_memoria_le
        description: "Memoria anual del SERMAS, capítulo «Lista de espera», situación a 31 de diciembre: primera consulta (Total y 10 especialidades), primera prueba diagnóstica (8 técnicas) y lista quirúrgica. Trae la fila «Número de pacientes sin fecha asignada» (desde 2016) que el informe mensual no publica. 2021-2025 de los XLSX de datos abiertos; 2015-2020 del PDF de la memoria completa; pruebas de 2024 del Resumen Ejecutivo (la hoja XLSX repite la de 2023). sin_fecha_en_total: si el total estructural ya incluye a los sin fecha (True) o no (False, memorias 2018 y pruebas de 2019)."
      - name: sermas_mensual
        description: "Informe mensual de listas de espera de la Comunidad de Madrid (CSV de cada mes) de consultas externas, pruebas diagnósticas y lista quirúrgica, desde 2015-2016: pacientes en espera estructural con cita, tramos de espera, tasa por 1.000 habitantes, demoras, entradas y salidas del mes."
      - name: sermas_le_balance
        description: "Memoria anual del SERMAS, «Balance de Libre Elección en hospitales»: citas entrantes (el paciente elige ese hospital viniendo de otro) y salientes (el paciente asignado se va a otro) por hospital; cada memoria da su año y el anterior. Memorias 2015-2020 (PDF) y 2021-2023 (XLSX)."
      - name: sermas_le_especialidad
        description: "Memoria anual del SERMAS, «Balance por especialidad»: primeras consultas y consultas realizadas por libre elección en cada especialidad, 2022-2025."
      - name: sermas_le_hospital
        description: "Memoria anual de cada hospital (datos abiertos XLSX, hoja «Consultas Libre Elección»): citas entrantes y salientes de libre elección por especialidad, 2021-2024."
      - name: sermas_consultas_hospital
        description: "Memoria anual de cada hospital (datos abiertos XLSX, hoja «Consultas Externas»): primeras consultas y consultas sucesivas por especialidad, 2021-2024."
