version: 2

sources:
  - name: raw_movilidad
    description: "Movilidad: microdatos de vehículos de la DGT (ingestion/dgt.py), puntos de recarga del NAP (ingestion/recarga.py) y transporte de viajeros del INE (ingestion/ine.py)"
    schema: raw
    tables:
      - name: dgt_matriculaciones
        description: "Matriculaciones ordinarias (CLAVE_TRAMITE=1) por mes, municipio del domicilio, grupo de vehículo, energía, nuevo/usado, renting y tipo de titular. MATRABA mensual desde 2015-01. co2_suma/co2_n para la media de CO2 homologado."
      - name: dgt_matriculaciones_modelos
        description: "Matriculaciones ordinarias por mes, grupo, energía, nuevo/usado, marca y modelo (España). Modelo sin la marca repetida delante."
      - name: dgt_parque
        description: "Parque de vehículos en alta al cierre de cada mes cargado, por municipio (vacío en los de <10.000 hab.: la DGT lo anonimiza), grupo, energía, distintivo ambiental y antigüedad."
      - name: dgt_parque_modelos
        description: "Parque de vehículos por mes, grupo, energía, marca y modelo (España)."
      - name: recarga_puntos
        description: "Foto actual de los puntos de recarga de acceso público (NAP DGT / MITECO), un registro por punto, con municipio y provincia asignados por coordenadas."
      - name: recarga_resumen_diario
        description: "Puntos, emplazamientos y potencia por provincia y tramo de potencia, un registro por día desde el primer día cargado."
      - name: ine_transporte_viajeros
        description: "INE Estadística de Transporte de Viajeros, tabla 20239: viajeros por modo (miles), mensual desde 2012, España."
      - name: ine_transporte_ciudades
        description: "INE Estadística de Transporte de Viajeros, tabla 20193: metro y autobús urbano en las ciudades con metro (miles), mensual desde 2012."
