version: 2

models:
  - name: salud_esperanza_vida
    description: "Esperanza de vida al nacer por España (Eurostat), comunidad y provincia (INE) y sexo."
    columns:
      - name: cod
        tests: [not_null]
      - name: nombre
        description: "Nombre del territorio (España, comunidad o provincia), el mismo que en territorios"
      - name: fuente
        description: "Eurostat para España, INE para comunidades y provincias"
  - name: salud_causas_muerte
    description: "Defunciones por causa (lista reducida y capítulos CIE-10), sexo, año y territorio de residencia, con tasa bruta por 100.000 hab."
    columns:
      - name: nombre
        description: "Nombre del territorio, el mismo que en territorios"
      - name: tipo_causa
        description: "total (Todas las causas, 001-102), capitulo (gran grupo de la CIE-10) o causa (causa concreta): sumar solo dentro de un mismo tipo"
  - name: salud_mortalidad_semanal
    description: "Defunciones semanales por comunidad y España y exceso sobre la media 2015-2019 de la misma semana, en bruto y por habitante."
    columns:
      - name: fecha
        description: "Primer día (lunes) de la semana"
      - name: nombre
        description: "Nombre del territorio, el mismo que en territorios"
      - name: poblacion
        description: "Población del territorio (padrón del año; el último para años posteriores). Nula en 1997 (sin padrón)."
      - name: defunciones_por_100k_hab
        description: "Defunciones de la semana por 100.000 habitantes"
      - name: media_2015_2019_por_100k_hab
        description: "Media de la tasa por 100.000 habitantes de la misma semana en 2015-2019"
      - name: exceso_pct
        description: "100 * (defunciones / media_2015_2019 - 1): exceso sobre las defunciones brutas, en % (0-100)"
      - name: exceso_hab_pct
        description: "Exceso sobre la tasa por habitante de 2015-2019, en % (0-100); corrige el crecimiento de la población, no el envejecimiento"
