version: 2

models:
  - name: renta_ecv_ccaa
    description: "ECV del INE por año de encuesta, España (cod '00') y comunidades: renta media por persona, por unidad de consumo y por hogar (nominal y real, renta del año anterior), tasa de riesgo de pobreza, AROPE, carencia material y social severa, baja intensidad en el trabajo, % con dificultad para llegar a fin de mes, Gini y S80/S20."
    columns:
      - name: nombre
        description: "Nombre del territorio (España o comunidad), el mismo que en territorios"
  - name: renta_ecv_edad
    description: "ECV del INE, España, por grupo de edad: AROPE, riesgo de pobreza, carencia material y social severa y renta real por persona y por unidad de consumo."
  - name: renta_municipios
    description: "ADRH del INE por municipio (código de 5 dígitos) y año 2015-2023: renta neta media por persona y por hogar, media y mediana por unidad de consumo (nominal y real), población del padrón y puesto en España por renta por persona."
  - name: renta_distritos
    description: "ADRH del INE por distrito censal (municipios con más de un distrito) y año: renta neta real por persona, por hogar y mediana por unidad de consumo."
  - name: renta_secciones
    description: >
      ADRH del INE por sección censal (municipios con más de una sección) y año: renta neta real
      por persona, por hogar y mediana por unidad de consumo, para los mapas de barrio. geo_anio
      dice qué seccionado del INE usar para pintarla (static-extra/geo/secciones/<geo_anio>/<cod_mun>.geojson).
    columns:
      - name: cod_seccion
        description: "Código INE de la sección censal (CUSEC): provincia, municipio, distrito (2) y sección (3)"
        tests: [not_null]
      - name: seccion
        description: "Etiqueta legible: «Distrito 01, sección 001»"
      - name: renta_persona_tope
        description: "Verdadero si la sección está en el valor máximo al que el INE corta la renta por persona ese año (su renta es esa cifra o más)"
      - name: renta_hogar_tope
        description: "Lo mismo para la renta por hogar"
      - name: renta_persona_suelo
        description: "Verdadero si la sección está en el valor mínimo al que el INE corta la renta por persona ese año (su renta es esa cifra o menos)"
      - name: renta_hogar_suelo
        description: "Lo mismo para la renta por hogar"
      - name: geo_anio
        description: "Año del seccionado del INE con el que se dibuja la sección"
        tests: [not_null]
  - name: renta_territorios
    description: "ADRH del INE para España, comunidades y provincias (código INE) por año: renta neta media por persona y por hogar y renta por unidad de consumo, nominal y real."
  - name: renta_ue
    description: "Eurostat EU-SILC para la UE-27 y sus países: Gini, S80/S20 y AROPE (% de población) por año de encuesta."
    columns:
      - name: cod_pais
        description: "Código ISO 3166-1 alfa-2 del país (Grecia = GR); EU27_2020 para la UE-27"
      - name: unidad
        description: "Unidad de valor según el indicador: % (arope), índice 0-100 (gini) o veces (s80_s20)"
      - name: es_ue
        description: "Verdadero para los 27 Estados miembros; falso para el agregado UE-27"
      - name: es_agregado
        description: "Verdadero solo para la fila del agregado UE-27"
