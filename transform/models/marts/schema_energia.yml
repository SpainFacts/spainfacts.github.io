version: 2

models:
  - name: energia_mix_electrico
    description: "Generación eléctrica anual nacional por tecnología (REE REData), años completos"
    columns:
      - name: año
        quote: true
        tests: [not_null]
      - name: tecnologia
        tests: [not_null]
      - name: tipo_fuente
        tests:
          - accepted_values:
              arguments:
                values: ['Renovable', 'No Renovable']
      - name: generacion_twh
        tests: [not_null]
  - name: energia_resumen_anual_mix
    description: "Resumen anual del sistema eléctrico: total, renovable, cuotas y demanda (REE)"
    columns:
      - name: año
        quote: true
        tests: [not_null, unique]
      - name: total_twh
        tests: [not_null]
      - name: cuota_renovable_pct
        tests: [not_null]
      - name: demanda_twh
        tests: [not_null]
  - name: energia_potencia_instalada
    description: "Potencia instalada a cierre de año por tecnología (REE o, en su defecto, Eurostat nrg_inf_epc)"
    columns:
      - name: año
        quote: true
        tests: [not_null]
      - name: tecnologia
        tests: [not_null]
      - name: potencia_mw
        tests: [not_null]
      - name: fuente
        tests: [not_null]
  - name: energia_emisiones_gei
    description: "Emisiones GEI por sector sin LULUCF (Eurostat env_air_gge, inventario nacional). Mapeo CRF en stg_energia_emisiones_gei."
    columns:
      - name: año
        quote: true
        tests: [not_null]
      - name: sector
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Generación Eléctrica', 'Transporte', 'Industria y Procesos', 'Residencial y Comercial', 'Agricultura y Ganadería', 'Residuos', 'Gases Fluorados y Otros']
      - name: millones_toneladas_co2eq
        tests: [not_null]
