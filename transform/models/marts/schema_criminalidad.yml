version: 2

models:
  - name: crimen_balance
    description: "Infracciones penales conocidas por año completo (2019-), territorio (España, comunidad, provincia y municipios de más de 20.000 hab.) y categoría, con tasa por 1.000 hab."
    columns:
      - name: cod
        tests: [not_null]
      - name: categoria
        tests: [not_null]
  - name: crimen_ultimo_periodo
    description: "Acumulado del año en curso del último Balance de Criminalidad frente al mismo periodo del año anterior."
  - name: crimen_serie_larga
    description: "Infracciones penales conocidas por año (2010-), España, comunidad y provincia y 44 tipologías, con tasa por 1.000 hab."
  - name: crimen_condenados
    description: "Condenados adultos por comunidad, sexo y nacionalidad y tasa por 1.000 residentes de 18+ de la misma nacionalidad y sexo."
  - name: crimen_condenas_delito
    description: "Delitos por los que se condena en España por tipo y nacionalidad del condenado."
