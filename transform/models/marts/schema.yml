version: 2

models:
  - name: metricas
    description: "Modelo largo de métricas: una fila por (metrica_id, periodo)"
    columns:
      - name: metrica_id
        tests: [not_null]
      - name: periodo
        tests: [not_null]
      - name: valor
        tests: [not_null]
      - name: url_fuente
        tests: [not_null]
  - name: trazabilidad_fuentes
    description: "Catálogo de trazabilidad y auditoría de fuentes oficiales en MotherDuck"
    columns:
      - name: fuente_id
        tests: [not_null, unique]
      - name: organismo
        tests: [not_null]
      - name: url_oficial
        tests: [not_null]
  - name: embalses_semanal
    description: "Reserva hídrica semanal por cuenca, demarcación y total España (MITECO)"
    columns:
      - name: fecha
        tests: [not_null]
      - name: cod
        tests: [not_null]
      - name: pct_llenado
        tests: [not_null]
  - name: embalses_estado_actual
    description: "Última semana por cuenca/demarcación/país vs año anterior y media de 10 años"
    columns:
      - name: id
        tests: [not_null, unique]
  - name: embalses_actual
    description: "Estado de cada embalse en la última semana publicada"
    columns:
      - name: embalse
        tests: [not_null]
      - name: cod_demarcacion
        description: "Null si aparece un ámbito nuevo sin mapear en seeds/cuencas_demarcaciones.csv"
        tests: [not_null]
  - name: observatorios_detalle
    description: "Observatorios públicos con nivel de la administración, ubicación (comunidad, provincia y municipio a partir del ámbito o del nombre), año de creación, estado (Activo, Inactivo o Sin información), tipo y partido que gobernaba la administración que lo creó (Gobierno de España, presidencia autonómica o alcaldía) a 1 de julio del año de creación."
