version: 2

models:
  - name: metricas
    description: "Modelo largo de métricas: una fila por (metrica_id, periodo)"
    columns:
      - name: metrica_id
        tests: [not_null]
      - name: periodo
        tests: [not_null]
      - name: valor
        tests: [not_null]
      - name: url_fuente
        tests: [not_null]
  - name: trazabilidad_fuentes
    description: "Catálogo de trazabilidad y auditoría de fuentes oficiales en MotherDuck"
    columns:
      - name: fuente_id
        tests: [not_null, unique]
      - name: organismo
        tests: [not_null]
      - name: url_oficial
        tests: [not_null]
  - name: ipc
    description: "IPC del INE (tabla 50902), todas las series"
    columns:
      - name: date
        tests: [not_null]
      - name: value
        tests: [not_null]
      - name: cod_serie
        tests: [not_null]
  - name: unemployment
    description: "Tasa de paro EPA (tabla 65292), todas las series"
    columns:
      - name: date
        tests: [not_null]
      - name: value
        tests: [not_null]
      - name: cod_serie
        tests: [not_null]
  - name: embalses_semanal
    description: "Reserva hídrica semanal por cuenca, demarcación y total España (MITECO)"
    columns:
      - name: fecha
        tests: [not_null]
      - name: clave
        tests: [not_null]
      - name: pct_llenado
        tests: [not_null]
  - name: embalses_estado_actual
    description: "Última semana por cuenca/demarcación/país vs año anterior y media de 10 años"
    columns:
      - name: id
        tests: [not_null, unique]
  - name: embalses_actual
    description: "Estado de cada embalse en la última semana publicada"
    columns:
      - name: embalse
        tests: [not_null]
      - name: cod_demarcacion
        description: "Null si aparece un ámbito nuevo sin mapear en seeds/cuencas_demarcaciones.csv"
        tests: [not_null]
  - name: poblacion_anual
    description: "Población a 1 de enero por año, provincia (o total nacional) y sexo (INE ECP)"
    columns:
      - name: anio
        tests: [not_null]
      - name: poblacion
        tests: [not_null]
  - name: poblacion_piramide
    description: "Población nacional por grupo quinquenal de edad y sexo (INE ECP)"
    columns:
      - name: rango_edad
        tests: [not_null]
  - name: observatorios
    description: "Censo de observatorios públicos (observatoriospublicos.es)"
    columns:
      - name: name
        tests: [not_null]
