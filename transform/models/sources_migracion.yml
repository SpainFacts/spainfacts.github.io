version: 2

sources:
  - name: raw_migracion
    description: "Inmigración: flujos y nacionalizaciones del INE (ingestion/ine.py), llegadas irregulares (ACNUR/Interior) y asilo (Eurostat) (ingestion/migracion.py)"
    schema: raw
    tables:
      - name: ine_flujos_inmigracion
        description: "INE tabla 59011: inmigraciones desde el extranjero por nacionalidad, trimestral."
      - name: ine_flujos_emigracion
        description: "INE tabla 59014: emigraciones al extranjero por nacionalidad, trimestral."
      - name: ine_nacionalizaciones
        description: "INE tabla 70012: adquisiciones de nacionalidad española por sexo, comunidad y nacionalidad previa, anual."
      - name: acnur_llegadas
        description: "Llegadas irregulares a España por mes y vía (mar península/Baleares, mar Canarias, tierra Ceuta/Melilla), ACNUR con datos de Interior."
      - name: eurostat_asilo_mensual
        description: "Eurostat migr_asyappctzm: primeras solicitudes de asilo en España por mes."
      - name: eurostat_asilo_nacionalidad
        description: "Eurostat migr_asyappctza: primeras solicitudes de asilo en España por año y nacionalidad."
      - name: ine_inmigraciones_anual
        description: "INE tabla 69687 (EMCR): inmigraciones procedentes del extranjero por año, sexo y edad, desde 2021."
      - name: ine_emigraciones_anual
        description: "INE tabla 69702 (EMCR): emigraciones con destino al extranjero por año, sexo y edad, desde 2021."
      - name: ine_saldos_migratorios
        description: "INE tabla 69758 (EMCR): saldos migratorios por nacionalidad, sexo y tipo (total, exterior, interior), España."
      - name: ine_saldos_migratorios_ccaa
        description: "INE tabla 69762 (EMCR): saldos por comunidad, edad, nacionalidad (española/extranjera), sexo y tipo."
      - name: eurostat_condenados_nacionalidad
        description: "Eurostat crim_just_ctz: personas condenadas por país y nacionalidad (citizen NAT del país, FOR extranjera, TOTAL), anual desde 2008."
      - name: eurostat_presos_nacionalidad
        description: "Eurostat crim_pris_ctz: presos por país y nacionalidad (NAT, FOR, TOTAL), anual."
      - name: eurostat_poblacion_nacionalidad
        description: "Eurostat migr_pop1ctz: población a 1 de enero por país, nacionalidad (NAT/FOR), sexo (T/M/F) y edad (TOTAL y grupos de cinco años desde 15), desde 2008."
      - name: eurostat_integracion
        description: "Eurostat, indicadores de integración por nacionalidad (NAT, FOR, EU27_2020_FOR, NEU27_2020_FOR), en %: empleo 20-64 (lfsa_ergan), paro 15-74 (lfsa_urgan), riesgo de pobreza o exclusión 18+ (ilc_peps05n), abandono escolar 18-24 (edat_lfse_01), sobrecualificación 20-64 (lfsa_eoqgan), hacinamiento 18+ (ilc_lvho15)."
      - name: eurostat_nacionalizaciones
        description: "Eurostat migr_acq: adquisiciones de nacionalidad por país y año (todas las edades y nacionalidades previas)."
