version: 2

sources:
  - name: raw_internacional
    description: "España frente al mundo y a Europa: Banco Mundial (WDI), FMI (WEO), Our World in Data (Ember, ONU Turismo, World Happiness Report, PNUD y coches eléctricos de la AIE), Eurostat y OCDE (vivienda social), todos los países que publica cada fuente (ingestion/internacional.py)"
    schema: raw
    tables:
      - name: internacional_banco_mundial
        description: "Banco Mundial WDI, formato largo: indicador_id, cod_indicador (WDI), cod_pais (ISO3 de todos los países o los agregados WLD, EUU, EMU y OED), anio, valor. Los agregados están ponderados por el Banco Mundial."
      - name: internacional_fmi
        description: "FMI WEO (DataMapper): deuda bruta (GGXWDG_NGDP, deuda_publica) y saldo (GGXCNL_NGDP, saldo_publico) de las AAPP en % del PIB, todos los países y grupos del FMI. Incluye previsiones (se descartan en staging). EUU = agregado 'EU' del FMI."
      - name: internacional_owid
        description: "Our World in Data, todos los países (ISO3) y los agregados EUU, OED y WLD: % de electricidad renovable (Ember), llegadas de turistas internacionales con pernoctación (ONU Turismo), satisfacción con la vida (escalera de Cantril), índice de desarrollo humano (PNUD) y cuota de coches eléctricos en las ventas de turismos (AIE)."
      - name: internacional_eurostat
        description: "Eurostat, unos 70 indicadores (EUROSTAT_CONSULTAS en ingestion/internacional.py) de todos los países y agregados que publica cada tabla: indicador_id, cod_indicador (tabla), geo (código de Eurostat: EL = Grecia, UK = Reino Unido, EU27_2020...), anio, periodo (2024 o 2024-S1 en las semestrales) y valor. Los indicador_id acabados en _aux y consumo_final_* solo sirven para calcular otros en staging."
      - name: internacional_ocde_vivienda
        description: "OCDE, Affordable Housing Database, PH4.2: viviendas sociales en alquiler en % del parque total de viviendas (vivienda_social_pct), hacia 2010 y hacia 2022 (año real de cada país); EUU y OED son las medias de la OCDE con el último dato de cada país (anio = 2022 por convención). Incluye Austria (AUT) y Reino Unido (GBR, solo Inglaterra)."
