version: 2

sources:
  - name: raw
    description: "Datos crudos cargados por dlt (ingestion/)"
    schema: raw
    tables:
      - name: ine_ipc
      - name: ine_paro
      - name: ine_poblacion_provincias
        description: "Población a 1 de enero por provincia, sexo y edad simple (INE 56945, ECP)"
      - name: eurostat_deuda
      - name: eurostat_cuentas_balance
      - name: eurostat_cuentas_gastos
      - name: eurostat_cuentas_ingresos
      - name: eurostat_hicp_paises
        description: "IPCA anual (2015=100) de todos los países y la UE-27, Eurostat prc_hicp_aind (ingestion/eurostat.py)"
      - name: eurostat_poblacion_media_paises
        description: "Población media anual de países y agregados, Eurostat demo_gind AVG (ingestion/eurostat.py)"
      - name: observatorios_publicos
        description: "Censo de observatorios públicos (observatoriospublicos.es), JSON sin limpiar"
      - name: miteco_embalses
        description: "Reserva hídrica semanal por embalse (MITECO, BD-Embalses 1988-hoy)"
      - name: ine_ecepov_calefaccion
        description: "INE ECEPOV 2021 (tabla 56784): viviendas principales con calefacción según combustible, por provincia (cod_prov '00' = España), tipo de edificio, año de construcción y tamaño del municipio."
      - name: ine_esperanza_vida_ccaa
        description: "INE tabla 1448: esperanza de vida al nacer por comunidad y sexo, anual desde 1975."
      - name: ine_esperanza_vida_provincia
        description: "INE tabla 1485: esperanza de vida al nacer por provincia y sexo."
      - name: ine_defunciones_semanales
        description: "INE tabla 35177 (EDeS): defunciones semanales por comunidad de residencia desde 1975."
      - name: ine_defunciones_causas
        description: "INE tabla 9936: defunciones por causa (lista reducida), sexo y provincia de residencia (cod_prov '00' = España, '99' = extranjero), anual desde 1980."
