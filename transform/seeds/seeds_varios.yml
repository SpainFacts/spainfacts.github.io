version: 2

seeds:
  - name: movilidad_energias
    description: "Tipos de energía de los vehículos (clasificación de ingestion/dgt.py: categoría eléctrica + propulsión ITV) con etiqueta, orden y color."
    config:
      column_types: {energia: varchar, etiqueta: varchar, etiqueta_corta: varchar, orden: integer, color: varchar, es_electrificado: boolean, es_enchufable: boolean}
    columns:
      - name: energia
        tests: [not_null, unique]
  - name: movilidad_grupos
    description: "Grupos de vehículos a partir del código de tipo DGT (ingestion/dgt.py: grupo_vehiculo)."
    config:
      column_types: {grupo: varchar, etiqueta: varchar, orden: integer}
    columns:
      - name: grupo
        tests: [not_null, unique]
  - name: ine_ccaa_nombres
    description: "Nombre de cada comunidad tal como lo escriben las tablas del INE (Tempus3) -> código INE de comunidad (00 = Total Nacional)."
    config:
      column_types: {nombre_ine: varchar, cod_ccaa: varchar}
    columns:
      - name: nombre_ine
        tests: [not_null, unique]
  - name: empleo_provincias_bepsap
    description: "Provincia tal como la escribe el Boletín Estadístico del Personal (sin tildes, en mayúsculas) -> código INE de provincia."
    config:
      column_types: {provincia_bepsap: varchar, cod_prov: varchar}
    columns:
      - name: provincia_bepsap
        tests: [not_null, unique]
