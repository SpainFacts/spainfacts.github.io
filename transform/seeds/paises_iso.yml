version: 2

seeds:
  - name: paises_iso
    description: >
      Países y agregados con un solo código para toda la web (ver tools/chat/semantica/CONVENCIONES.md):
      cod_pais = ISO 3166-1 alfa-2 (EU27_2020, EA, OECD, WLD para los agregados), con su ISO3 (Banco Mundial,
      OCDE, V-Dem) y su código de Eurostat (EL = Grecia, UK = Reino Unido), y el nombre en castellano.
      Desde 2026-10 están todos los países del Banco Mundial (las filas nuevas y los mapas de
      static/geo salen de tools/geo/paises_mundo.py); por eso las tablas que lo unen ya no
      quedan limitadas a una lista corta de países: si una página quiere solo unos pocos,
      los filtra ella.
    config:
      column_types: {cod_pais: varchar, iso3: varchar, eurostat: varchar, pais: varchar, es_ue: boolean, es_ocde: boolean, es_agregado: boolean, region: varchar, es_europa: boolean}
    columns:
      - name: cod_pais
        tests: [not_null, unique]
      - name: iso3
        tests: [not_null, unique]
      - name: eurostat
        tests: [not_null, unique]
      - name: region
        description: "Región del Banco Mundial, en castellano (vacía en los agregados)."
      - name: es_europa
        description: "País europeo (Consejo de Europa, UE y vecinos del este, Turquía y el Cáucaso incluidos): los que salen en España en Europa."
